<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two-Step Verification | Liner Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/theme.css" rel="stylesheet">
  <script src="assets/js/app.js"></script>
</head>
<body class="bg-slate-50">
<div class="min-vh-100 d-flex align-items-center justify-content-center p-4">
  <div class="w-100 max-w-420">
    <div class="text-center mb-4">
      <img src="img/logo.svg" alt="Liner" class="logo logo-lg mx-auto mb-3 logo-img">
      <h1 class="fs-4 fw-bold">Liner Admin</h1>
    </div>
    <div class="card p-4">
      <div class="text-center mb-4">
        <div class="icon-circle icon-circle-xl icon-circle-bg-primary-soft mx-auto mb-3"><i data-lucide="shield-check" class="lucide-xl text-primary"></i></div>
        <h2 class="fw-bold mb-1">Two-Step Verification</h2>
        <p class="text-muted small">We sent a 6-digit verification code to <br><strong class="text-body">j**n@example.com</strong></p>
      </div>
      <form id="otp-form" class="space-y-3">
        <label class="form-label small fw-medium text-center d-block">Enter your 6-digit code</label>
        <div class="d-flex justify-content-center gap-2 mb-3" id="otp-inputs">
          <input class="form-control otp-input" maxlength="1" inputmode="numeric">
          <input class="form-control otp-input" maxlength="1" inputmode="numeric">
          <input class="form-control otp-input" maxlength="1" inputmode="numeric">
          <input class="form-control otp-input" maxlength="1" inputmode="numeric">
          <input class="form-control otp-input" maxlength="1" inputmode="numeric">
          <input class="form-control otp-input" maxlength="1" inputmode="numeric">
        </div>
        <p id="otp-error" class="text-center text-xs text-danger d-none"></p>
        <button id="otp-submit" type="submit" class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2 py-2">
          <i data-lucide="shield-check" class="lucide-sm"></i>
          <span id="otp-btn-text">Verify Code</span>
        </button>
      </form>
      <div class="text-center mt-3 small">
        <p class="text-muted mb-1">
          Didn't receive the code?
          <button id="otp-resend" class="btn btn-link btn-sm p-0 text-primary fw-medium d-inline-flex align-items-center gap-1">
            <i data-lucide="rotate-ccw" class="lucide-xs"></i> Resend
          </button>
          <span id="otp-resent" class="text-success d-none">Code resent!</span>
        </p>
        <p class="text-xs text-muted">The code expires in 10 minutes.</p>
        <a href="login.html" class="d-inline-flex align-items-center gap-2 text-muted text-decoration-none">
          <i data-lucide="arrow-left" class="lucide-sm"></i> Back to Login
        </a>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</body>
</html>
