<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance | Liner Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/theme.css" rel="stylesheet">
  <script src="assets/js/app.js"></script>
</head>
<body class="bg-slate-900">
<div class="min-vh-100 d-flex align-items-center justify-content-center p-4 position-relative overflow-hidden">
  <div class="maintenance-orb maintenance-orb-1"></div>
  <div class="maintenance-orb maintenance-orb-2"></div>
  <div class="maintenance-orb maintenance-orb-3"></div>
  <div class="maintenance-gear maintenance-gear-1"><i data-lucide="wrench" class="lucide-3xl"></i></div>
  <div class="maintenance-gear maintenance-gear-2"><i data-lucide="wrench" class="lucide-xl"></i></div>

  <div class="text-center w-100 max-w-560 position-relative text-white">
    <div class="d-flex align-items-center justify-content-center gap-3 mb-4">
      <img src="img/logo.svg" alt="Liner" class="logo logo-img">
      <span class="fs-3 fw-bold">Liner Admin</span>
    </div>

    <div class="mx-auto mb-4 maintenance-icon-box"><i data-lucide="wrench" class="lucide-3xl text-indigo-300"></i></div>

    <h1 class="display-5 fw-bold mb-3">Under Maintenance</h1>
    <p class="fs-6 text-white opacity-75 mb-4 lh-lg">
      We're currently performing scheduled maintenance to improve your experience. We'll be back shortly!
    </p>

    <div class="d-flex align-items-center justify-content-center gap-3 mb-4" id="countdown">
      <div class="text-center">
        <div class="maintenance-time-box"><span class="font-monospace fs-3 fw-bold" data-cd="h">04</span></div>
        <span class="text-xs opacity-50 text-uppercase mt-1 d-block">Hours</span>
      </div>
      <span class="fs-3 fw-bold text-indigo-300 mb-4">:</span>
      <div class="text-center">
        <div class="maintenance-time-box"><span class="font-monospace fs-3 fw-bold" data-cd="m">32</span></div>
        <span class="text-xs opacity-50 text-uppercase mt-1 d-block">Minutes</span>
      </div>
      <span class="fs-3 fw-bold text-indigo-300 mb-4">:</span>
      <div class="text-center">
        <div class="maintenance-time-box"><span class="font-monospace fs-3 fw-bold" data-cd="s">47</span></div>
        <span class="text-xs opacity-50 text-uppercase mt-1 d-block">Seconds</span>
      </div>
    </div>

    <div id="notify-view" class="maintenance-notify-card mb-3">
      <div class="d-flex align-items-center gap-2 mb-2">
        <i data-lucide="clock" class="lucide-sm text-indigo-300"></i>
        <p class="small fw-medium mb-0">Get notified when we're back</p>
      </div>
      <div class="d-flex gap-2">
        <input id="notify-email" type="email" class="form-control bg-white-10 border-white-20 text-white placeholder-white-40 flex-grow-1" placeholder="Enter your email">
        <button id="notify-btn" class="btn btn-primary d-inline-flex align-items-center gap-2"><i data-lucide="mail" class="lucide-sm"></i> Notify Me</button>
      </div>
    </div>
    <div id="notify-done" class="maintenance-notify-success mb-3 d-none">
      <p class="small fw-medium mb-0 text-emerald-300">You'll be notified at <span id="notify-shown"></span> when we're back!</p>
    </div>

    <div class="d-flex align-items-center justify-content-center gap-3 small">
      <a href="dashboard.html" class="text-indigo-300 text-decoration-none">Try Again</a>
      <span class="opacity-25">·</span>
      <a href="#" class="text-white opacity-50 text-decoration-none">Status Page</a>
      <span class="opacity-25">·</span>
      <a href="#" class="text-white opacity-50 text-decoration-none d-inline-flex align-items-center gap-1"><i data-lucide="twitter" class="lucide-xs"></i>@LinerAdmin</a>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</body>
</html>
